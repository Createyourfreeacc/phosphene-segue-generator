<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phosphene · Segue Generator (PSG)</title>
<style>/* PSG UI — preview-dominant stage · bottom transport · right control panel (psg-ui-design.md). */
:root{
  --bg:#0b0b10; --panel:#13131b; --panel2:#191922; --line:#2a2a37; --line2:#363648;
  --ink:#e9e9f0; --ink2:#a6a6b6; --ink3:#6f6f82;
  --accent:#c5ff15; --accent2:var(--accent); --hot:#fe0089;   /* --accent is driven from the live palette */
  --radius:9px; --h:30px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font:13px/1.45 'Sora',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:var(--ink);cursor:pointer}
#app{height:100%;display:grid;grid-template-columns:1fr 376px;grid-template-rows:1fr auto;
  grid-template-areas:"stage panel" "transport panel"}
/* themed scrollbar (panel) */
#panelBody{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#panelBody::-webkit-scrollbar{width:10px}
#panelBody::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--panel)}
#panelBody::-webkit-scrollbar-thumb:hover{background:var(--ink3)}
#panelBody::-webkit-scrollbar-track{background:transparent}

/* preview stage */
#stageWrap{grid-area:stage;position:relative;display:grid;place-items:center;min-height:0;min-width:0;
  background-color:#1b1b24;
  background-image:linear-gradient(45deg,#15151c 25%,transparent 25%,transparent 75%,#15151c 75%),
    linear-gradient(45deg,#15151c 25%,transparent 25%,transparent 75%,#15151c 75%);
  background-size:26px 26px;background-position:0 0,13px 13px}
#stage{max-width:100%;max-height:100%;display:block;box-shadow:0 0 0 1px var(--line)}
#titleOverlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:2}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:11px;color:var(--ink2)}
.chip.on{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:600}

/* transport */
#transport{grid-area:transport;display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:var(--panel);border-top:1px solid var(--line)}
#transport button.t{width:var(--h);height:var(--h);border:1px solid var(--line);background:var(--panel2);
  border-radius:7px;display:grid;place-items:center;font-size:13px}
#transport button.t.on{background:var(--accent2);border-color:var(--accent2);color:#04222a}
#scrub{flex:1;accent-color:var(--accent2);height:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{padding:5px 10px;background:var(--panel2);border:0;border-right:1px solid var(--line);font-size:11px;color:var(--ink2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent2);color:#04222a;font-weight:600}
select.mini{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink);height:var(--h);padding:0 6px}

/* right panel */
#panel{grid-area:panel;background:var(--panel);border-left:1px solid var(--line);
  display:grid;grid-template-rows:auto 1fr;min-height:0}
#panelHead{position:sticky;top:0;z-index:2;padding:12px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:8px}
#randomize{height:54px;border:0;border-radius:var(--radius);font-size:16px;font-weight:700;letter-spacing:.14em;
  color:#0a0a0a;background:linear-gradient(95deg,var(--accent),var(--accent2));box-shadow:0 2px 18px -6px var(--accent2)}
#randomize:active{transform:translateY(1px)}
.row2{display:flex;gap:8px}
.famgallery{display:flex;flex-wrap:wrap;gap:5px}
.famgallery button{flex:1 0 auto;min-width:62px;padding:7px 6px;border:1px solid var(--line2);background:var(--panel2);border-radius:7px;font-size:11px;color:var(--ink2);text-align:center}
.famgallery button.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
.row2 button{flex:1;height:34px;border:1px solid var(--line2);background:var(--panel2);border-radius:8px;font-weight:600}
#exportBtn{background:var(--panel2)}
.headutil{display:flex;gap:8px;align-items:center;justify-content:space-between;color:var(--ink2);font-size:11px}
.toggle{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent2)}

#panelBody{overflow-y:auto;padding:6px 12px 40px}
details.grp{border-bottom:1px solid var(--line);padding:6px 0}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
  padding:6px 2px;font-weight:600;letter-spacing:.03em;color:var(--ink)}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .caret{color:var(--ink3);transition:transform .15s;font-size:10px}
details.grp[open]>summary .caret{transform:rotate(90deg)}

/* param rows */
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:7px 2px}
.prow .plabel{color:var(--ink2);font-size:12px}
.prow .pval{font-variant-numeric:tabular-nums;font-size:11px;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;min-width:46px;text-align:right}
.prow .slot{grid-column:1/3}

/* 3-knob slider */
.knob3{position:relative;height:26px;margin-top:2px}
.knob3 .track{position:absolute;top:11px;left:0;right:0;height:4px;background:var(--panel2);border-radius:3px;border:1px solid var(--line)}
.knob3 .band{position:absolute;top:11px;height:4px;background:linear-gradient(90deg,var(--accent),var(--ink3));opacity:.45;border-radius:3px}
.knob3 .h{position:absolute;top:5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;cursor:grab;touch-action:none}
.knob3 .h.cur{top:3px;width:18px;height:18px;margin-left:-9px;background:var(--ink);border:2px solid var(--accent2);box-shadow:0 1px 4px rgba(0,0,0,.5);z-index:3}
.knob3 .h.bnd{background:var(--panel);border:2px solid var(--accent);z-index:2}
.knob3.noband .h.bnd{display:none}
.knob3.noband .band{display:none}

/* enum chips / bool tristate */
.chiprow{display:flex;flex-wrap:wrap;gap:5px;grid-column:1/3;margin-top:3px}
.chiprow button{padding:4px 9px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;font-size:11px;color:var(--ink2)}
.chiprow button.on{background:var(--accent);color:#0a0a0a;border-color:var(--accent);font-weight:600}
.chiprow button.rand{outline:1px dashed var(--accent2);outline-offset:1px}
.tristate{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content}
.tristate button{padding:3px 10px;background:var(--panel2);border:0;border-right:1px solid var(--line);font-size:11px;color:var(--ink2)}
.tristate button:last-child{border-right:0}
.tristate button.on{background:var(--accent2);color:#04222a;font-weight:600}

/* colour panel */
.swatchstrip{display:flex;gap:4px;grid-column:1/3;margin:4px 0}
.swatchstrip .sw{flex:1;height:30px;border-radius:6px;border:1px solid var(--line);cursor:pointer;position:relative}
.swatchstrip .sw.sel{outline:2px solid var(--accent);outline-offset:1px}
.swatchstrip .sw .role{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:8px;color:rgba(255,255,255,.85);text-shadow:0 1px 1px #000}
/* per-axis 2-D gamut chart (flat backdrop shows through where there's no colour) */
.cchart{position:relative;grid-column:1/3;height:92px;border-radius:8px;border:1px solid var(--line);margin:6px 0 2px;overflow:hidden;cursor:crosshair;background:#101017}
.cchart canvas{position:absolute;inset:0;width:100%;height:100%}
.cchart .dot{position:absolute;width:11px;height:11px;margin:-5.5px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #000,0 1px 3px #000;pointer-events:none;z-index:4}
/* crosshair lines (white, difference-blended so they read over any colour) + the randomize default-range box */
.cchart .cx{position:absolute;pointer-events:none;z-index:3;background:#fff;mix-blend-mode:difference;opacity:.55}
.cchart .cx.hl{left:0;right:0;height:1px;margin-top:-.5px}
.cchart .cx.vl{top:0;bottom:0;width:1px;margin-left:-.5px}
.cchart .cband{position:absolute;pointer-events:none;z-index:2;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.06);display:none}

/* export dialog */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:12px;
  padding:0;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg-h{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.dlg-b{padding:16px;display:grid;gap:12px}
.dlg-b label{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--ink2)}
.dlg-b input,.dlg-b select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink);height:30px;padding:0 8px}
.dlg-f{padding:14px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.dlg-f button{height:36px;padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-weight:600}
.dlg-f button.go{background:var(--accent);color:#0a0a0a;border-color:var(--accent)}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--accent);transition:width .1s}
.note{font-size:11px;color:var(--ink3)}

/* hierarchical colour panel (decisions-log §U2) */
.colpanel{grid-column:1/3;display:flex;flex-direction:column;gap:6px;margin:4px 0}
.collabel{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-top:4px}
.chiprow.scheme button{flex:1}
.roleblock{border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:var(--panel2)}
.roleblock.open{background:var(--panel)}
.rolehdr{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--ink2);padding:2px 0}
.rolehdr .caret{font-size:10px;color:var(--ink3)}
.rolehdr .rolename{flex:1}

/* editable seed field */
.headutil .seedlbl{color:var(--ink3)}
.seedfield{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  color:var(--ink);font:inherit;font-size:11px;font-variant-numeric:tabular-nums;padding:3px 7px}
.seedfield:focus{outline:none;border-color:var(--accent)}
.textfield{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink);font:inherit;font-size:12px;padding:4px 8px;margin-top:3px}
.textfield:focus{outline:none;border-color:var(--accent)}

/* scrub: boundary markers + hover thumbnail preview */
.scrubwrap{position:relative;flex:1;display:flex;align-items:center}
.scrubwrap #scrub{flex:1}
.scrubmarks{position:absolute;inset:0;pointer-events:none}
.scrubmark{position:absolute;top:50%;width:2px;height:14px;transform:translate(-1px,-50%);background:var(--accent);opacity:.7;border-radius:1px}
.scrubprev{position:absolute;bottom:24px;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:2px;pointer-events:none;z-index:5}
.scrubprev.show{display:flex}
.scrubprev canvas{width:128px;height:72px;border-radius:6px;border:1px solid var(--line2);background:#0c0c12;box-shadow:0 4px 16px -4px #000}
.scrubprev .pt{font-size:10px;font-variant-numeric:tabular-nums;color:var(--ink2);background:rgba(0,0,0,.6);padding:1px 5px;border-radius:4px}

/* oklch-style colour axis: gamut-painted track + draggable 3-knob (current value + randomize-band handles) */
.caxis{position:relative;height:20px;border-radius:6px;border:1px solid var(--line);margin-top:4px;grid-column:1/3;background:#101017}
.caxis .axiscanvas{position:absolute;inset:0;width:100%;height:100%;border-radius:5px}
.caxis .band{position:absolute;top:0;bottom:0;border-top:2px solid var(--accent);border-bottom:2px solid var(--accent);opacity:.85;pointer-events:none;z-index:1}
.caxis .h{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2.5px;border-radius:3px;cursor:ew-resize;touch-action:none}
.caxis .h.cur{width:7px;margin-left:-3.5px;background:#fff;box-shadow:0 0 0 1.5px #000,0 0 0 3px rgba(255,255,255,.55);z-index:3}
.caxis .h.bnd{background:rgba(255,255,255,.7);box-shadow:0 0 0 1px #000;z-index:2}
.caxis.noband .h.bnd,.caxis.noband .band{display:none}
input.pval{font:inherit;font-size:11px;width:58px}
input.pval.pedit{cursor:text}
input.pval:focus,.csreadout .cscode:not([readonly]):focus{outline:none;border-color:var(--accent)}
.csreadout .cscode:not([readonly]){cursor:text}
/* 3-D gamut mini + readout */
.gamut3d{grid-column:1/3;height:172px;border:1px solid var(--line);border-radius:8px;background:#0c0c12;margin:8px 0 4px;overflow:hidden;cursor:grab;touch-action:none}
.gamut3d:active{cursor:grabbing}
.gamut3d canvas{width:100%;height:100%;display:block}
.csreadout{grid-column:1/3;display:flex;gap:6px;margin:4px 0}
.csreadout .cscode{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink);
  font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:0 8px;height:28px;cursor:copy}
.csreadout .cscode-fmt{height:28px}
</style>
<body>
<div id="app">
  <main id="stageWrap"><canvas id="stage"></canvas></main>
  <footer id="transport"></footer>
  <aside id="panel"><div id="panelHead"></div><div id="panelBody"></div></aside>
</div>

// Seeded RNG — xmur3 (string→32-bit seed) + mulberry32 (seed→PRNG). Deterministic, no deps.
// Determinism contract (research-and-design §7): same seed string → same stream, everywhere.
function xmur3(str) {

    h = (h << 13) | (h >>> 19);

    h = Math.imul(h ^ (h >>> 13), 3266489909);

  const aL0 = p.anchorL != null ? p.anchorL : 0.65;
  const aC0 = p.anchorC != null ? p.anchorC : 0.15;
  const cf = Math.max(0, Math.min(1, aC0 / Math.max(1e-4, fH(aH0) * ceilC(Math.max(0.02, Math.min(0.99, aL0)), aH0))));

  // GROUND — dark recessive; read stops STRAIGHT off the manifold at a high-ridge cool hue (no
  // double-sibling → top stop lands at the spec's ~L0.6 dark-teal launchpad, not near-black).
  const ground = keep('ground', () => {
    const gH = aH0 + rng.float(-14, 14);   // ground is analogous to the base (harmonious at any base hue)
    const gd = p.groundDark != null ? p.groundDark : 0.72;
    const topDL = -(0.10 + gd * 0.24);
    const groundStops = [topDL, topDL - 0.08, topDL - 0.21].map(dl => manifoldColour(gH, dl, cf));
    return { groundStops, groundTopL: groundStops[0].L, groundHue: gH };
  });
  // BASE — absolute OKLCH anchor (out-of-gamut allowed; oklchToRgb clamps to the cube on render).
  const base = keep('base', () => ({ anchor: absColour(aL0, aC0, aH0) }));
  const anchor = base.anchor;
  // SIBLINGS — dark/light, spread by siblingSpread.
  const sib = keep('sibling', () => {
    const spread = p.siblingSpread != null ? p.siblingSpread : 0.18;
    const dbh = dLbounds(anchor.H);
    return { dark: sibling(anchor, -Math.max(0.06, Math.min(0.30, spread))),
             light: sibling(anchor, Math.max(0.02, Math.min(Math.max(0.04, dbh.hi), spread * 0.5))) };
  });
  // GRADIENT-PARTNER — one hue off base via the chosen template.
  const grad = keep('gradient', () => {
    const tpl = PARTNER_TEMPLATES[p.gradientTemplate] || PARTNER_TEMPLATES.analogous;
    const gHue = ((tpl(anchor.H, rng)[0] % 360) + 360) % 360;
    return { gradient: manifoldColour(gHue, rng.tri(dLbounds(gHue).lo * 0.3, 0, dLbounds(gHue).hi * 0.3), cf) };
  });
  // ACCENT — partner template, value-moat + collision guard.
  const acc = keep('accent', () => {
    let accent, accentEdge = false, tries = 0;
    const tplKey = p.accentTemplate || 'splitComplement';
    const tension = p.accentTension != null ? p.accentTension : 25;     // accentTension now drives the split arm
    do {
      let acH = (tplKey === 'splitComplement') ? anchor.H + 180 + (rng.bool() ? tension : -tension)
        : (PARTNER_TEMPLATES[tplKey] || PARTNER_TEMPLATES.complement)(anchor.H, rng)[0];
      acH = ((acH % 360) + 360) % 360;
      accent = manifoldColour(acH, rng.tri(dLbounds(acH).lo * 0.3, 0, dLbounds(acH).hi * 0.3), cf);
      accentEdge = inCollisionZone(anchor.H, acH) || (accent.L - ground.groundTopL) < 0.10;
      tries++;
    } while (accentEdge && tries < 8);
    return { accent, accentEdge };
  });

  const setCount = p.setCount != null ? p.setCount : 2;
  const useAccent = setCount >= 2;                         // count=1 → mono (accent collapses to base)
  const focus = manifoldColour(rgbToOklch(202, 255, 2).H, 0, cf);   // chartreuse glow (~OKLCH H125); tracks vividness (cf 0 ⇒ grey in mono)
  const white = { L: 1, C: 0, H: 0, rgb: [255, 255, 255], hex: '#FFFFFF' };
  const black = { L: 0, C: 0, H: 0, rgb: [0, 0, 0], hex: '#000000' };
  const accent = useAccent ? acc.accent : anchor;
  return {
    groundStops: ground.groundStops, groundTopL: ground.groundTopL, groundHue: ground.groundHue,
    anchor, dark: sib.dark, light: sib.light, gradient: grad.gradient,
    accent, accentEdge: useAccent && acc.accentEdge, focus, white, black,
    setCount, vividBudget: p.vividBudget != null ? p.vividBudget : 0.18,
    hexes: { ground: ground.groundStops.map(s => s.hex), anchor: anchor.hex, dark: sib.dark.hex,
             light: sib.light.hex, gradient: grad.gradient.hex, accent: accent.hex, focus: focus.hex },
  };
}


// ===== js/curve.js =====
// PSG curve system — the Range-of-Curves model + the draggable bezier/control-point editor.
// Implements docs/curve-system-design.md (= decisions-log §E): ONE Curve type, ONE pure curveEval,
// the two role-keyed catalogue halves, rules-only sampleCurve, and the canvas editor (§3.3 / §E.3).
//
// EVALUATION MODEL (per the user's contract): every curve evaluates through a centripetal
// Catmull-Rom spline passing through the curve's KNOTS. A "knot" is {x,y,...}. The named families
// (sine/smootherstep/easeOutBack/…) are deterministic knot GENERATORS — a preset is just a set of
// knots produced from its shape params, so analytic presets, shape-adjusted presets and hand-dragged
// freeform curves are three views of ONE data shape with ONE evaluator.
//   - role:'reveal'   → monotone-ish 0→1, endpoints PINNED: curveEval(c,0)=0, curveEval(c,1)=1.
//   - role:'oscillator' → periodic & seamless: the seam knot is WELDED (first==last value, and the
//     wrap-around tangent matches) so curveEval(c,0)===curveEval(c,1) and slopes match at the seam.
//
// PURE: this module reads `document` ONLY inside curveEditor(), so it imports cleanly in node.
//
// ── ui.js INTEGRATION CONTRACT ───────────────────────────────────────────────────────────────────
// ui.js will replace its static curve row (the `staticRow` branch for p.type==='curve') with:
//
//   el('div', { class: 'slot' }, [
//     curveEditor(
//       () => app.state.params[key],                 // getCurve(): current Curve (or curveId string)
//       v  => app.setParam(key, v),                  // setCurve(curve): called on every edit
//       { role: key === 'loopOsc' ? 'oscillator' : 'reveal', band: theParamRow }   // opts
//     )
//   ])
//
// getCurve() may return a Curve object OR a bare curveId string (curveEditor coerces a string via the
// catalogue). opts.role is the binding-site role; opts.band is the ParamRow (its curveFamily /
// curveJitter.envelope / curveJitter.pointCount drive the chips + the translucent jitter band, §U1).
// ──────────────────────────────────────────────────────────────────────────────────────────────────

// ===== small pure helpers (cv-prefixed — share one scope with the other modules after the build strips imports) =====
const cvClamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const cvLerp = (a, b, t) => a + (b - a) * t;
const cvTAU = Math.PI * 2;
const cvSamples = 192;              // polyline resolution for the plot + band hull
const cvEps = 1e-4;

// ============================================================================================
//  1. KNOT GENERATORS — each named family is a deterministic function (shapeParams) → knots[].
//     A knot = {x, y}. x is monotone 0..1. curveEval splines through these via centripetal CR.
//     Reveals generate knots with y(0)=0, y(1)=1. Oscillators generate a CLOSED knot ring whose
//     first and last knot are the welded seam (same y, periodic tangent) → seamless by construction.
// ============================================================================================

// resolve a shape param (may be a number, or a 3-knob Param {cur} / {full,band}) to a scalar
function cvShape(c, name, dflt) {
  const sp = c && c.shapeParams;
  if (!sp) return dflt;
  const v = sp[name];
  if (v == null) return dflt;
  if (typeof v === 'number') return v;
  if (typeof v.cur === 'number') return v.cur;
  return dflt;
}

// sample an analytic formula at N+1 stations → knots[]. fn(u)→y. Used by analytic families so the
// editor/eval go through ONE spline path. n = interior resolution (more = closer to the closed form).
function cvKnotsFromFn(fn, n) {
  const k = [];
  for (let i = 0; i <= n; i++) { const x = i / n; k.push({ x, y: fn(x) }); }
  return k;
}

// REVEAL ease closed forms (E.4 §5.1). Each returns y for u∈[0,1], pinned 0→1.
const cvRevealFn = {
  linear: () => (u) => u,
  smoothstep: () => (u) => u * u * (3 - 2 * u),
  smootherstep: () => (u) => u * u * u * (u * (u * 6 - 15) + 10),
  easeInOutSine: () => (u) => 0.5 - 0.5 * Math.cos(Math.PI * u),
  easeInCubic: () => (u) => u * u * u,
  easeOutCubic: () => (u) => 1 - (1 - u) ** 3,
  easeInOutCubic: () => (u) => (u < 0.5 ? 4 * u * u * u : 1 - (-2 * u + 2) ** 3 / 2),
  expo: () => (u) => (u <= 0 ? 0 : u >= 1 ? 1 : 2 ** (10 * u - 10)),
  spring: (c) => { const a = cvShape(c, 'a', 6), b = cvShape(c, 'b', 9); return (u) => 1 - Math.exp(-a * u) * Math.cos(b * u); },
  easeOutBack: (c) => { const s = cvShape(c, 's', 1.70158), c3 = s + 1; return (u) => 1 + c3 * (u - 1) ** 3 + s * (u - 1) ** 2; },
  easeOutElastic: (c) => {
    const amp = cvShape(c, 'amp', 1), period = cvShape(c, 'period', 0.3), k = cvTAU / period;
    return (u) => (u <= 0 ? 0 : u >= 1 ? 1 : amp * 2 ** (-10 * u) * Math.sin((10 * u - 0.75) * k) + 1);
  },
  easeOutBounce: () => (u) => {
    const n1 = 7.5625, d1 = 2.75;
    if (u < 1 / d1) return n1 * u * u;
    if (u < 2 / d1) { u -= 1.5 / d1; return n1 * u * u + 0.75; }
    if (u < 2.5 / d1) { u -= 2.25 / d1; return n1 * u * u + 0.9375; }
    u -= 2.625 / d1; return n1 * u * u + 0.984375;
  },
};

// OSCILLATOR closed forms (E.4 §5.2). y for u∈[0,1), centred −1..+1, periodic for integer cyc.
const cvOscFn = {
  sine: (c) => { const cyc = Math.round(cvShape(c, 'cyc', 1)); return (u) => Math.sin(cvTAU * cyc * u); },
  cosine: (c) => { const cyc = Math.round(cvShape(c, 'cyc', 1)); return (u) => Math.cos(cvTAU * cyc * u); },
  triangle: (c) => { const cyc = Math.round(cvShape(c, 'cyc', 1)); return (u) => (2 / Math.PI) * Math.asin(Math.sin(cvTAU * cyc * u)); },
  pulse: (c) => {
    const cyc = Math.round(cvShape(c, 'cyc', 1)), duty = cvClamp(cvShape(c, 'duty', 0.5), 0.1, 0.9);
    // a SMOOTH one-sided bump (not a square wave): raise the sine floor then re-centre to −1..1.
    // `duty` sharpens the bump (higher exponent = narrower, lower = broader). Periodic for integer cyc.
    const pw = cvLerp(0.6, 4, duty);
    return (u) => { const s = 0.5 + 0.5 * Math.cos(cvTAU * cyc * u); return Math.pow(s, pw) * 2 - 1; };
  },
  breathe: (c) => {
    const cyc = Math.round(cvShape(c, 'cyc', 1)), skew = cvClamp(cvShape(c, 'skew', -0.3), -0.9, 0.9);
    // asymmetric grow-shrink: warp the phase so slow-in / fast-out (or vice-versa). Periodic in u.
    return (u) => { const p = (cyc * u) % 1, w = p + skew * Math.sin(cvTAU * p) / cvTAU; return Math.sin(cvTAU * w); };
  },
  wobble: (c) => { const cyc = Math.round(cvShape(c, 'cyc', 1)); return (u) => { const k = cvTAU * cyc * u; return 0.7 * Math.sin(k) + 0.3 * Math.sin(2 * k); }; },
  bounceLoop: (c) => { const cyc = Math.round(cvShape(c, 'cyc', 1)); return (u) => Math.abs(Math.sin(Math.PI * cyc * u)) * 2 - 1; },
  driftSpin: () => (u) => u,                       // monotone ramp consumed mod content symmetry (E.5b)
  noiseLoop: (c) => {
    const cyc = Math.max(1, Math.round(cvShape(c, 'cyc', 2))), seed = cvShape(c, 'seed', 1);
    // value-noise sampled on a CIRCLE so it is seamless: integer # of lattice points around the loop.
    const N = cyc * 4, amp = [];
    for (let i = 0; i < N; i++) { const t = Math.sin((i + 1) * 12.9898 + seed * 78.233) * 43758.5453; amp.push((t - Math.floor(t)) * 2 - 1); }
    return (u) => { const f = ((u % 1) + 1) % 1 * N, i = Math.floor(f), fr = f - i, a = amp[i % N], b = amp[(i + 1) % N], s = fr * fr * (3 - 2 * fr); return cvLerp(a, b, s); };
  },
};

// ============================================================================================
//  2. CATALOGUE — named curves, each: { id, role, kind, hasPoly, shape, make() → knots }.
//     `shape` carries the default shape-param values + their {min,max} bands (for jitter, §2).
//     `make()` produces the knot ring (the generator), wrapping analytic fns into knots.
// ============================================================================================

const cvANALYTIC_KNOTS = 16;        // stations an analytic family bakes to (enough for a clean spline)

function cvRevealEntry(id, shape) {
  return {
    id, role: 'reveal', kind: id, hasPoly: false, shape: shape || {},
    make(c) { const fn = cvRevealFn[id](c || { shapeParams: cvDefaults(shape) }); return cvKnotsFromFn(fn, cvANALYTIC_KNOTS); },
  };
}
function cvOscEntry(id, shape) {
  return {
    id, role: 'oscillator', kind: id, hasPoly: false, shape: shape || {},
    make(c) {
      const fn = cvOscFn[id](c || { shapeParams: cvDefaults(shape) });
      const k = cvKnotsFromFn(fn, cvANALYTIC_KNOTS);
      // WELD the seam: force the last knot's y to equal the first (the analytic forms already do for
      // integer cyc, but a snap protects breathe/noiseLoop/driftSpin numerically).
      k[k.length - 1] = { x: 1, y: k[0].y };
      return k;
    },
  };
}
function cvDefaults(shape) { const o = {}; for (const k in (shape || {})) o[k] = shape[k].def; return o; }

const cvCATALOGUE = {
  // ---- REVEAL EASES ----
  linear: cvRevealEntry('linear'),
  smoothstep: cvRevealEntry('smoothstep'),
  smootherstep: cvRevealEntry('smootherstep'),
  easeInOutSine: cvRevealEntry('easeInOutSine'),
  easeInCubic: cvRevealEntry('easeInCubic'),
  easeOutCubic: cvRevealEntry('easeOutCubic'),
  easeInOutCubic: cvRevealEntry('easeInOutCubic'),
  expo: cvRevealEntry('expo'),
  spring: cvRevealEntry('spring', { a: { def: 6, min: 4, max: 9 }, b: { def: 9, min: 6, max: 14 } }),
  easeOutBack: cvRevealEntry('easeOutBack', { s: { def: 1.70158, min: 0.5, max: 3 } }),
  easeOutElastic: cvRevealEntry('easeOutElastic', { amp: { def: 1, min: 0.5, max: 1.5 }, period: { def: 0.3, min: 0.2, max: 0.5 } }),
  easeOutBounce: cvRevealEntry('easeOutBounce'),
  stepped: {
    id: 'stepped', role: 'reveal', kind: 'stepped', hasPoly: true, isStepped: true,
    shape: { n: { def: 4, min: 2, max: 8 } },
    make(c) {
      const n = Math.max(2, Math.round(cvShape(c, 'n', 4))), k = [];
      for (let i = 0; i <= n; i++) { const x = i / n; k.push({ x, y: Math.min(1, Math.floor(x * n) / (n - 1)) }); }
      return k;
    },
  },
  bezier: {
    id: 'bezier', role: 'reveal', kind: 'bezier', hasPoly: true,
    shape: {},
    // freeform reveal seed = the classic CSS cubic-bezier(.25,.1,.25,1) "ease" as 4 knots.
    make() { const fn = (u) => u * u * (3 - 2 * u); return [{ x: 0, y: 0 }, { x: 0.34, y: cvClamp(fn(0.34), 0, 1) }, { x: 0.66, y: cvClamp(fn(0.66), 0, 1) }, { x: 1, y: 1 }]; },
  },
  // ---- LOOP OSCILLATORS ----
  sine: cvOscEntry('sine', { cyc: { def: 1, min: 1, max: 6, int: true } }),
  cosine: cvOscEntry('cosine', { cyc: { def: 1, min: 1, max: 6, int: true } }),
  triangle: cvOscEntry('triangle', { cyc: { def: 1, min: 1, max: 6, int: true } }),
  pulse: cvOscEntry('pulse', { cyc: { def: 1, min: 1, max: 6, int: true }, duty: { def: 0.5, min: 0.1, max: 0.9 } }),
  breathe: cvOscEntry('breathe', { cyc: { def: 1, min: 1, max: 4, int: true }, skew: { def: -0.3, min: -1, max: 1 } }),
  wobble: cvOscEntry('wobble', { cyc: { def: 1, min: 1, max: 6, int: true } }),
  bounceLoop: cvOscEntry('bounceLoop', { cyc: { def: 1, min: 1, max: 6, int: true } }),
  driftSpin: cvOscEntry('driftSpin'),
  noiseLoop: cvOscEntry('noiseLoop', { cyc: { def: 2, min: 1, max: 6, int: true }, seed: { def: 1, min: 0, max: 99 } }),
  'custom-periodic': {
    id: 'custom-periodic', role: 'oscillator', kind: 'custom-periodic', hasPoly: true,
    shape: {},
    // freeform oscillator seed = one welded sine through 5 knots (first==last value).
    make() {
      const N = 5, k = [];
      for (let i = 0; i <= N; i++) { const x = i / N; k.push({ x, y: i === N ? 0 : Math.sin(cvTAU * x) }); }
      return k;
    },
  },
};

// the family lists per role (used by sampleCurve eligibility + the editor chip row).
const cvREVEAL_IDS = ['linear', 'smoothstep', 'smootherstep', 'easeInOutSine', 'easeInCubic', 'easeOutCubic', 'easeInOutCubic', 'expo', 'spring', 'easeOutBack', 'easeOutElastic', 'easeOutBounce', 'stepped', 'bezier'];
const cvOSC_IDS = ['sine', 'cosine', 'triangle', 'pulse', 'breathe', 'wobble', 'bounceLoop', 'driftSpin', 'noiseLoop', 'custom-periodic'];

// ============================================================================================
//  3. curveEval(curve, u) → y — ONE pure function. Splines through the curve's knots with a
//     centripetal Catmull-Rom. Reveals are open (endpoints pinned); oscillators are CLOSED (wrap).
// ============================================================================================

// coerce a curveId string / partial into a concrete Curve {kind, role, shapeParams, knots, ...}.
function cvResolve(curve, role) {
  if (curve && curve.knots) return curve;                         // already concrete
  if (typeof curve === 'string') return cvMakeCurve(curve, role); // a bare curveId
  if (curve && curve.kind && cvCATALOGUE[curve.kind]) {           // {kind, shapeParams} without knots
    const e = cvCATALOGUE[curve.kind];
    return { kind: curve.kind, role: e.role, shapeParams: curve.shapeParams || cvDefaults(e.shape), points: curve.points, knots: curve.points || e.make(curve), symmetry: curve.symmetry };
  }
  return cvMakeCurve(role === 'oscillator' ? 'sine' : 'easeInOutSine', role);
}

// build a fresh concrete Curve from a catalogue id (default shape).
function cvMakeCurve(id, role) {
  const e = cvCATALOGUE[id] || cvCATALOGUE[role === 'oscillator' ? 'sine' : 'easeInOutSine'];
  const shapeParams = cvDefaults(e.shape);
  const c = { kind: e.id, role: e.role, shapeParams, symmetry: e.role === 'oscillator' ? 'wrap-locked' : 'free' };
  c.knots = e.make(c);
  if (e.hasPoly) c.points = c.knots;       // editable poly == the knots themselves
  return c;
}

// centripetal Catmull-Rom segment eval. p1→p2 is the active span; p0,p3 are neighbours. t∈[0,1].
function cvCR(p0, p1, p2, p3, t) {
  const a = 0.5;            // centripetal-ish blend; symmetric uniform CR is fine for our knot density
  const t2 = t * t, t3 = t2 * t;
  const y = a * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
  return y;
}

function cvEvalKnots(knots, u, closed) {
  const n = knots.length;
  if (n === 0) return 0;
  if (n === 1) return knots[0].y;
  u = closed ? ((u % 1) + 1) % 1 : cvClamp(u, 0, 1);
  // locate the span [i, i+1] by x (knots monotone in x).
  let i = 0;
  while (i < n - 1 && u > knots[i + 1].x) i++;
  const k1 = knots[i], k2 = knots[Math.min(i + 1, n - 1)];
  const span = (k2.x - k1.x) || 1;
  const t = cvClamp((u - k1.x) / span, 0, 1);
  // neighbours, wrapping for closed (skip the duplicated seam knot so the ring is C¹ at the weld).
  let p0y, p3y;
  if (closed) {
    const m = n - 1;                       // last knot is the seam duplicate of knot 0
    const im = ((i - 1) % m + m) % m, ip = (i + 1) % m, ip2 = (i + 2) % m;
    p0y = knots[im].y; p3y = knots[ip2].y;
    return cvCR(p0y, knots[i % m].y, knots[ip].y, p3y, t);
  }
  p0y = (i > 0 ? knots[i - 1] : k1).y;
  p3y = (i + 2 < n ? knots[i + 2] : k2).y;
  return cvCR(p0y, k1.y, k2.y, p3y, t);
}

function curveEval(curve, u) {
  const c = cvResolve(curve);
  const closed = c.role === 'oscillator';
  let y = cvEvalKnots(c.knots, u, closed);
  if (c.invert) y = closed ? -y : 1 - y;
  if (!closed) {
    // pin the reveal endpoints exactly (spline rounding can drift a hair) and clamp to a sane ceiling.
    if (u <= cvEps) return 0;
    if (u >= 1 - cvEps) return 1;
  }
  return y;
}

// ============================================================================================
//  4. sampleCurve(band, rng) → a concrete Curve. RULES-ONLY (U7): pick an eligible family, roll
//     pointCount if the curve has a control polygon, jitter shape params within the envelope.
//     Freeform (bezier / custom-periodic) is NEVER produced here — it is excluded from `family`.
// ============================================================================================

function sampleCurve(band, rng) {
  band = band || {};
  const role = band.role || (band.curveRole) || 'reveal';
  // (1) eligible family — from band.curveFamily (the ParamRow field), else role default set minus freeform.
  let family = (band.curveFamily && band.curveFamily.length) ? band.curveFamily.slice() : null;
  if (!family) family = (role === 'oscillator' ? cvOSC_IDS : cvREVEAL_IDS).filter((id) => id !== 'bezier' && id !== 'custom-periodic');
  family = family.filter((id) => cvCATALOGUE[id] && id !== 'bezier' && id !== 'custom-periodic');
  if (!family.length) family = [role === 'oscillator' ? 'sine' : 'easeInOutSine'];

  const weights = band.weights;
  let id;
  if (weights && weights.length === family.length && rng.weighted) id = rng.weighted(family.map((v, i) => ({ v, w: weights[i] })));
  else id = rng.pick ? rng.pick(family) : family[Math.floor((rng.next ? rng.next() : Math.random()) * family.length)];

  const e = cvCATALOGUE[id];
  const c = { kind: e.id, role: e.role, shapeParams: cvDefaults(e.shape), symmetry: e.role === 'oscillator' ? 'wrap-locked' : 'free' };

  // (2) jitter — one dial scaling all shape params by a fraction of each param's own band half-width.
  const jitter = band.curveJitter && band.curveJitter.envelope != null ? band.curveJitter.envelope : (band.jitter != null ? band.jitter : 0.35);
  for (const name in e.shape) {
    const sp = e.shape[name], lo = sp.min, hi = sp.max, centre = (lo + hi) / 2, halfW = (hi - lo) / 2;
    if (name === 'cyc') continue;                                 // cyc is integer-snapped, never jittered (§2.3)
    const signed = (rng.float ? rng.float(-1, 1) : (rng.next ? rng.next() : Math.random()) * 2 - 1);
    let v = centre + jitter * halfW * signed;
    if (sp.int) v = Math.round(v);
    c.shapeParams[name] = cvClamp(v, lo, hi);
  }
  // cyc: roll an integer within its band (no jitter), default 1 (§E.6).
  if (e.shape.cyc) {

// ParamRow model (psg-ui-design §7.1) — the universal 3-knob param {full, band, cur}.

// Pure, node-testable.

// ===== js/randomize.js =====
// Randomize engine — rules-only (decisions-log U7). Pick a family (weighted), resolve its params
// within their bands, assemble an on-manifold palette. No mood macro: the anchor-hue BAND is the hue
// region directly. Honours per-role colour pins + per-param locks. Per-state row clones (band edits
// don't mutate the shared template). Deterministic from seed.

// enum-string → shader int maps (resolved at roll time so drawFrame stays branch-free)
const MARK_ID = { circle: 0, star: 1, square: 2, hexagon: 3, ring: 4 };
const EDGE_ID = { flat: 0, gradient: 1 };
const CONFIG_ID = { crystal: 0, mosaic: 1 };
function encodeEnums(params) {
  if (typeof params.markKind === 'string') params.markKind = MARK_ID[params.markKind] ?? 0;
  if (typeof params.edgeStyle === 'string') params.edgeStyle = EDGE_ID[params.edgeStyle] ?? 1;
  if (typeof params.configPreset === 'string') params.configPreset = CONFIG_ID[params.configPreset] ?? 0;
}
// hue-arc (deg, 0..180) between the two loop colours → drives the auto white-bloom (F5)
function hueArcDeg(palette) {
  const a = palette.anchor, b = palette.dark;
  if (!a || !b || a.H == null || b.H == null) return 0;
  let d = Math.abs(a.H - b.H) % 360; return d > 180 ? 360 - d : d;
}

// pick a family — honour an explicit lock, else the randomize-eligible pool (dotted tiles), else all (weighted)
function pickFamily(rng, lock, pool) {
  if (lock && FAMILIES[lock]) return lock;
  const keys = (pool && pool.length) ? pool.filter(k => FAMILIES[k]) : familyList();
  return rng.weighted((keys.length ? keys : familyList()).map(k => ({ v: k, w: FAMILIES[k].weight || 1 })));
}

// On a family change, carry EVERY user edit whose param exists in the new family too (timing/structure/palette/motion/
// effects/title rows share keys + ranges across all families). ELEMENT rows are skipped: some element keys collide
// across families with DIFFERENT full ranges (waveCount 2..12 vs 4..24, skewAngle -45..45 vs 0..360) or are
// family-defining (configPreset crystal/mosaic) — carrying them produced out-of-range values or the wrong family
// identity (e.g. the Crystal family rendering as Mosaic). Carried bands/curs are also clamped to the new row's
// full range so a value legal in the source family can never land out of range here.
function carryEdits(rows, prev) {
  const clampToFull = (v, full) => full ? Math.max(full.min, Math.min(full.max, v)) : v;
  for (const r of rows) {
    if (r.group === 'element') continue;                                                  // element params are family-specific — never carry
    const p = prev.find(q => q.key === r.key);
    if (!p) continue;
    if (p.band) r.band = r.full ? { randMin: clampToFull(p.band.randMin, r.full), randMax: clampToFull(p.band.randMax, r.full) } : { ...p.band };
    if (p.cur != null && (!r.options || r.options.includes(p.cur))) r.cur = (typeof p.cur === 'number') ? clampToFull(p.cur, r.full) : p.cur;   // keep cur unless this family's enum lacks it
    if (p.randSet) { const inter = r.options ? p.randSet.filter(o => r.options.includes(o)) : [...p.randSet]; if (inter.length) r.randSet = inter; }   // intersect enum sets with this family's options
  }
}

function rollTransition(seedStr, opts = {}) {
  const rng = makeRng(seedStr);
  const familyKey = opts.family || pickFamily(rng, opts.familyLock, opts.famRand);
  const fam = FAMILIES[familyKey];
  // same family → keep ALL edits; family change → fresh family rows but carry the (family-independent) palette edits
  let rows;
  if (opts.rows && opts.rowsFamily === familyKey) rows = opts.rows;
  else { rows = cloneRows(fam.rows); if (opts.rows) carryEdits(rows, opts.rows); }
  const params = resolveSpec(rows, rng);
  clampGamutChroma(params);   // rolls stay vivid AND in-gamut; user picker edits bypass this and may go OOG
  params.family = fam.familyId;
  params._familyKey = familyKey;
  params.revealId = REVEAL_ID[params.revealKind] ?? 0;
  const palette = assembleTransition(rng, params);
  encodeEnums(params);
  params.hueArc = hueArcDeg(palette);
  return { seed: seedStr, familyKey, params, palette, rows };
}

function defaultState(familyKey = 'waves', seed = 'psg-default') {
  const fam = FAMILIES[familyKey];
  const rows = cloneRows(fam.rows);
  const params = currentValues(rows);
  clampGamutChroma(params);   // keep the un-rolled default base in-gamut (mirror rollTransition; else the first-load picker is OOG)
  params.family = fam.familyId;
  params._familyKey = familyKey;
  params.revealId = REVEAL_ID[params.revealKind] ?? 0;
  const palette = assembleTransition(makeRng(seed), params);
  encodeEnums(params);
  params.hueArc = hueArcDeg(palette);
  return { seed, familyKey, params, palette, rows };
}


// ===== js/glsl.js =====
// GLSL — the uber fragment shader. Shared preamble (UV, noise, REVEAL MATTES + dispatch, vignette, FX)
// + per-family functions dispatched by uFamily. The matte alpha IS the output alpha. Reveal dispatch
// (uRevealKind) makes families distinct: wipe / growOut / shatter / dotSweep / whiteBloom.

const VERT = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p*2.0-1.0,0.0,1.0); }`;

const UNIFORMS = [
  'uResolution', 'uTotalSize', 'uTileOffset', 'uT', 'uFamily',
  'uIntroEnd', 'uLoopEnd',
  'uRevealKind', 'uSweepDir', 'uEdgeCurvature', 'uFeatherFrac',
  'uWaveCount', 'uWaveFreq', 'uWaveAmp', 'uWarpStrength', 'uFlowSpeed', 'uBandSharpness', 'uSkewAngle', 'uPhaseOffset', 'uMergeSplit',
  'uVignette', 'uGradientTint', 'uPulse', 'uFlash',
  'uColA', 'uColB', 'uGroundTop', 'uGroundBot', 'uAccent',
  'uMarkKind', 'uBarCount', 'uBandGapFrac', 'uHardEdge', 'uFacetDensity', 'uFacetJitter',
  'uEdgeStyle', 'uConfigPreset', 'uOnlineSplitPos', 'uOnlineGradient', 'uHueArc', 'uGradient', 'uColorAlpha',
];

const FRAG_PREAMBLE = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2  uResolution, uTotalSize, uTileOffset;
uniform float uT;
uniform int   uFamily, uRevealKind;
uniform float uIntroEnd, uLoopEnd;
uniform float uSweepDir, uEdgeCurvature, uFeatherFrac;
uniform int   uWaveCount;
uniform float uWaveFreq, uWaveAmp, uWarpStrength, uFlowSpeed, uBandSharpness, uSkewAngle, uPhaseOffset, uMergeSplit;
uniform float uVignette, uGradientTint, uPulse, uFlash;
uniform vec3  uColA, uColB, uGroundTop, uGroundBot, uAccent;
uniform int   uMarkKind, uHardEdge, uEdgeStyle, uConfigPreset, uOnlineGradient;
uniform float uBarCount, uBandGapFrac, uFacetDensity, uFacetJitter, uOnlineSplitPos, uHueArc;
uniform vec3  uGradient;
uniform float uColorAlpha;     // global per-colour opacity (default 1); composites within the frame
const float TAU = 6.28318530718, PI = 3.14159265359;

vec2 uv01(){ return (gl_FragCoord.xy + uTileOffset) / uTotalSize; }
float aspect(){ return uTotalSize.x / uTotalSize.y; }

vec2 hash22(vec2 p){ p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3))); return -1.0+2.0*fract(sin(p)*43758.5453123); }
float gnoise(vec2 p){
  vec2 i=floor(p), f=fract(p), u=f*f*(3.0-2.0*f);
  return mix(mix(dot(hash22(i+vec2(0,0)),f-vec2(0,0)), dot(hash22(i+vec2(1,0)),f-vec2(1,0)), u.x),
             mix(dot(hash22(i+vec2(0,1)),f-vec2(0,1)), dot(hash22(i+vec2(1,1)),f-vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p){ float a=0.5,s=0.0; for(int i=0;i<4;i++){ s+=a*gnoise(p); p=p*2.02+vec2(11.7,3.1); a*=0.5; } return s; }

float revealProgress(){
  if (uT < uIntroEnd)      return clamp(uT / max(uIntroEnd, 1e-4), 0.0, 1.0);
  else if (uT < uLoopEnd)  return 1.0;
  else                     return clamp(1.0 - (uT - uLoopEnd) / max(1.0 - uLoopEnd, 1e-4), 0.0, 1.0);
}

// ---- REVEAL MATTES — coverage in [0,1]; prog drives the front 0→1. Seamless + tile-continuous. ----
float sweepCoord(vec2 uv){
  float sd = radians(uSweepDir);
  vec2 d = vec2(cos(sd), sin(sd)), perp = vec2(-d.y, d.x);
  return dot(uv - 0.5, d) + 0.5 + uEdgeCurvature * 0.18 * sin(dot(uv - 0.5, perp) * PI);
}
float wipeMatte(vec2 uv, float prog){
  float fe = uFeatherFrac, coord = sweepCoord(uv), front = prog * (1.0 + 2.0*fe) - fe;
  if (fe <= 0.0) return step(coord, front);                       // hard edge when feather==0
  return 1.0 - smoothstep(front, front + fe, coord);
}
float growOutMatte(vec2 uv, float prog){
  float dens = max(2.0, uWaveFreq * float(uWaveCount));
  vec2 p = vec2(uv.x*aspect(), uv.y) * dens, fp = fract(p);
  float lead = prog * 1.6 - 0.3;
  float r = clamp((lead - sweepCoord(uv)) * 2.4 + 0.5, 0.0, 1.0);
  return smoothstep(r + 0.06, r - 0.06, length(fp - 0.5) * 1.41);
}
float shatterMatte(vec2 uv, float prog){
  float dens = max(6.0, uFacetDensity);
  vec2 ip = floor(vec2(uv.x*aspect(), uv.y) * (dens*0.12));
  float cellRnd = fract(sin(dot(ip, vec2(12.9898,78.233))) * 43758.5453);
  float arrive = floor(mix(sweepCoord(uv), cellRnd, 0.35) * 6.0) / 6.0;   // stepped batches
  return step(arrive, prog);
}
float dotSweepMatte(vec2 uv, float prog){
  vec2 p = vec2(uv.x*aspect(), uv.y);
  float dens = max(2.0, float(uWaveCount)*1.6);
  vec2 cell = vec2(1.0/dens), id = floor(p / cell);
  vec2 cen = (id + vec2(0.5 + mod(id.y,2.0)*0.5, 0.5)) * cell;
  float grow = smoothstep(sweepCoord(cen) - 0.02, sweepCoord(cen) + 0.12, prog) * 0.92;

const FRAG_FAMILIES = `

vec4 family_online(vec2 uv){

const FRAG_MAIN = `
void main(){

// ===== js/exporter.js =====
// Alpha export — render each frame at full res, gl.readPixels straight alpha, encodePNG (lossless),
// fflate.zipSync (store) + manifest.json. The alpha self-check GATES every export. Global `fflate`.

const totalDur = s => { const p = s.params; return (p.introDur || 1.83) + (p.loopDur || 1.73) + (p.outroDur || 1.43); };
// a t mid-way through the intro reveal — where the matte has BOTH transparent and opaque pixels
const gateT = s => ((s.params.introDur || 1.83) * 0.5) / totalDur(s);
const stripPriv = p => { const o = {}; for (const k in p) if (!k.startsWith('_')) o[k] = p[k]; return o; };
const strU8 = s => (typeof fflate !== 'undefined' && fflate.strToU8) ? fflate.strToU8(s) : new TextEncoder().encode(s);

async function exportSequence(app, opts = {}, onProgress) {
  const engine = app.engine, state = app.state;
  const W = opts.width || 1920, H = opts.height || 1080, fps = opts.fps || 30;
  const frames = opts.frames || Math.max(1, Math.round((opts.durationSec || totalDur(state)) * fps));
  const wasPlaying = app.playing; app.playing = false;
  const cv = engine.canvas, cw = cv.width, ch = cv.height;
  cv.width = W; cv.height = H;
  try {
    const chk = engine.alphaSelfCheck(state, gateT(state));          // GATE
    if (!chk.ok && !opts.force) throw new Error(`alpha self-check failed (minα ${chk.minA}, maxα ${chk.maxA}); not a valid matte`);

    const files = {};
    for (let i = 0; i < frames; i++) {
      engine.drawFrame(state, i / frames);
      const buf = engine.readRGBA();
      tlCompositeBuffer(buf, state.params, state.palette, i / frames);    // burn the title into the matte
      files[`frame_${String(i).padStart(5, '0')}.png`] = encodePNG(buf.px, W, H);
      if (onProgress) onProgress((i + 1) / frames, i + 1, frames);
      if (opts.yield && (i & 3) === 3) await new Promise(r => setTimeout(r, 0)); // keep the UI responsive
    }
    const manifest = {
      schemaVersion: 1, width: W, height: H, fps, frames, durationSec: frames / fps,
      alpha: true, tiling: null, seed: state.seed, familyKey: state.familyKey,
      params: stripPriv(state.params),
    };
    files['manifest.json'] = strU8(JSON.stringify(manifest, null, 2));
    const zip = fflate.zipSync(files, { level: 0 });                 // PNGs already compressed → store
    return { zip, manifest, frames };
  } finally {
    cv.width = cw; cv.height = ch; app.playing = wasPlaying;
  }
}

// browser download helper (used by the export dialog in Phase 5)
function downloadZip(zip, name = 'psg-frames.zip') {
  const blob = new Blob([zip], { type: 'application/zip' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}


// ===== js/model3d.js =====
// model3d.js — self-contained WebGL2 OKLCH gamut solid, zero deps. Mirrors oklch.com's lib/model.ts structure:
// a single-valued height field over (L,H) with CHROMA as the height (y-up); x=L, z=H/360. The hue-end faces are
// closed down to a grey lightness-ramp FLOOR (C=0 plane), so it reads as a solid with sides + bottom, not an open shell.
// Three grey iso-lines (current L / C / H planes) mark the current colour. Orbit by drag, zoom by wheel.
// createGamut3D(canvas) → { setSlice(L,C,H), redraw(), dispose() } or null if WebGL2 is unavailable.

const M3_CMAX = 0.37;   // matches the picker's absolute chroma ceiling (so the 3-D height lines up with the charts)

// ---- column-major mat4 helpers ----
const m3cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const m3dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const m3norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
function m3persp(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0];
}
function m3lookAt(eye, ctr, up) {
  const z = m3norm([eye[0] - ctr[0], eye[1] - ctr[1], eye[2] - ctr[2]]);
  const x = m3norm(m3cross(up, z)), y = m3cross(z, x);
  return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -m3dot(x, eye), -m3dot(y, eye), -m3dot(z, eye), 1];
}
function m3mul(a, b) { const o = new Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; } return o; }

// ---- gamut mesh: height field C=ceilC(L,H) (y=chroma) over the (L,H) plane, hue-ends skirted to a grey floor ----
function buildMesh(divL, divH) {
  const pos = [], col = [], idx = [];
  const Yc = c => c / (2 * M3_CMAX);                                    // chroma → normalised height
  const push = (x, y, z, r, g, b) => { pos.push(x, y, z); col.push(r, g, b); };
  const stride = divH + 1;
  // chroma capped to the gamut edge, tapered to 0 at the black/white poles. ceilC's ±1e-4 gamut slack otherwise fakes
  // ~0.11 chroma at L≈0 (machine-zero rgb still passes), spiking black protrusions the true sRGB solid doesn't have.
  // The taper collapses those AND pins the L-ends onto the floor, so the solid closes on all four sides without walls.
  const ss = (e, x) => { const t = Math.max(0, Math.min(1, x / e)); return t * t * (3 - 2 * t); };
  const cap = (L, H) => ceilC(L, H) * ss(0.08, L) * ss(0.08, 1 - L);
  // top shell
  for (let i = 0; i <= divL; i++) { const L = i / divL;
    for (let j = 0; j <= divH; j++) { const H = j / divH * 360, C = cap(L, H), { rgb } = oklchToRgb(L, C, H); push(L, Yc(C), j / divH, rgb[0] / 255, rgb[1] / 255, rgb[2] / 255); } }
  for (let i = 0; i < divL; i++) for (let j = 0; j < divH; j++) { const a = i * stride + j; idx.push(a, a + 1, a + stride, a + 1, a + stride + 1, a + stride); }
  // skirt: close the H=0 and H=360 hue-ends (the red leaf cross-sections) straight down to the floor (C=0)
  for (const j of [0, divH]) { const base = pos.length / 3, H = j / divH * 360, z = j / divH;
    for (let i = 0; i <= divL; i++) { const L = i / divL, C = cap(L, H), { rgb } = oklchToRgb(L, C, H), r = rgb[0] / 255, g = rgb[1] / 255, b = rgb[2] / 255; push(L, Yc(C), z, r, g, b); push(L, 0, z, r * 0.55, g * 0.55, b * 0.55); }
    for (let i = 0; i < divL; i++) { const a = base + i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); } }
  // grey lightness-ramp floor on the C=0 plane the solid sits on
  { const base = pos.length / 3, seg = 24;
    for (let i = 0; i <= seg; i++) { const { rgb } = oklchToRgb(i / seg, 0, 0), g = rgb[0] / 255; push(i / seg, 0, 0, g, g, g); push(i / seg, 0, 1, g, g, g); }
    for (let i = 0; i < seg; i++) { const a = base + i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); } }
  // centre on the origin
  const n = pos.length / 3; let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++) { cx += pos[i * 3]; cy += pos[i * 3 + 1]; cz += pos[i * 3 + 2]; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++) { pos[i * 3] -= cx; pos[i * 3 + 1] -= cy; pos[i * 3 + 2] -= cz; }
  return { pos: new Float32Array(pos), col: new Float32Array(col), idx: new Uint16Array(idx), centroid: [cx, cy, cz], cmax: M3_CMAX };
}

function m3compile(gl, vs, fs) {
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

function createGamut3D(canvas) {
  const gl = canvas.getContext('webgl2', { alpha: true, antialias: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
  if (!gl) return null;
  const prog = m3compile(gl, `#version 300 es
in vec3 aPos; in vec3 aCol; uniform mat4 uMVP; out vec3 vCol; out vec3 vPos;
void main(){ vCol = aCol; vPos = aPos; gl_Position = uMVP * vec4(aPos, 1.0); }`, `#version 300 es
precision highp float; in vec3 vCol; in vec3 vPos; uniform vec3 uSlice; out vec4 o;
void main(){ vec3 c = vCol; float w = 0.006, g = 0.62;
  c = mix(c, vec3(g), smoothstep(w, 0.0, abs(vPos.x - uSlice.x)));   // L plane
  c = mix(c, vec3(g), smoothstep(w, 0.0, abs(vPos.y - uSlice.y)));   // C plane
  c = mix(c, vec3(g), smoothstep(w, 0.0, abs(vPos.z - uSlice.z)));   // H plane
  o = vec4(c, 1.0); }`);
  const mesh = buildMesh(44, 80);
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const buf = (data, loc, n, target = gl.ARRAY_BUFFER) => { const b = gl.createBuffer(); gl.bindBuffer(target, b); gl.bufferData(target, data, gl.STATIC_DRAW); if (loc >= 0) { gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, n, gl.FLOAT, false, 0, 0); } };
  buf(mesh.pos, gl.getAttribLocation(prog, 'aPos'), 3);
  buf(mesh.col, gl.getAttribLocation(prog, 'aCol'), 3);
  buf(mesh.idx, -1, 0, gl.ELEMENT_ARRAY_BUFFER);
  const uMVP = gl.getUniformLocation(prog, 'uMVP'), uSlice = gl.getUniformLocation(prog, 'uSlice');
  gl.enable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
  let yaw = 0.7, pitch = 0.34, dist = 1.7, slice = [9, 9, 9], raf = 0;
  function draw() {
    raf = 0;
    const w = canvas.clientWidth || 280, h = canvas.clientHeight || 150, dpr = Math.min(devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
    gl.viewport(0, 0, canvas.width, canvas.height); gl.clearColor(0.30, 0.30, 0.36, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);   // neutral so dark gamut faces stay visible
    const eye = [dist * Math.cos(pitch) * Math.cos(yaw), dist * Math.sin(pitch), dist * Math.cos(pitch) * Math.sin(yaw)];
    const mvp = m3mul(m3persp(1.2, (w / h) || 1, 0.05, 20), m3lookAt(eye, [0, 0, 0], [0, 1, 0]));
    gl.useProgram(prog); gl.bindVertexArray(vao);
    gl.uniformMatrix4fv(uMVP, false, mvp); gl.uniform3f(uSlice, slice[0], slice[1], slice[2]);
    gl.drawElements(gl.TRIANGLES, mesh.idx.length, gl.UNSIGNED_SHORT, 0);
  }
  const redraw = () => { if (!raf) raf = requestAnimationFrame(draw); };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); canvas.setPointerCapture(e.pointerId); let px = e.clientX, py = e.clientY;
    const mv = ev => { yaw -= (ev.clientX - px) * 0.01; pitch = Math.max(-1.45, Math.min(1.45, pitch + (ev.clientY - py) * 0.01)); px = ev.clientX; py = ev.clientY; redraw(); };
    const up = () => { canvas.removeEventListener('pointermove', mv); canvas.removeEventListener('pointerup', up); };
    canvas.addEventListener('pointermove', mv); canvas.addEventListener('pointerup', up);
  });
  canvas.addEventListener('wheel', e => { e.preventDefault(); dist = Math.max(0.95, Math.min(3.5, dist * (1 + Math.sign(e.deltaY) * 0.08))); redraw(); }, { passive: false });
  redraw();
  return {
    setSlice(L, C, H) { slice = [L - mesh.centroid[0], C / (2 * mesh.cmax) - mesh.centroid[1], (((H % 360) + 360) % 360) / 360 - mesh.centroid[2]]; redraw(); },
    redraw,
    dispose() { const e = gl.getExtension('WEBGL_lose_context'); if (e) e.loseContext(); },
  };
}


// ===== js/ui.js =====
// PSG UI — builds the transport, the hero-Randomize panel, the auto-generated 3-knob control bank
// (one renderer per param type), the oklch.com-style colour panel, and the export dialog. Vanilla DOM.

// tiny DOM helper
function el(tag, attrs = {}, kids = []) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'text') e.textContent = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];           // only ever fed literal markup, never user text
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  for (const c of [].concat(kids)) if (c != null) e.append(c);
  return e;
}
const fmt = (v, p) => typeof v === 'number' ? (Math.abs(v) >= 100 || Number.isInteger(v) ? v.toFixed(0) : v.toFixed(p && p.step < 0.05 ? 2 : 2)) : v;
const GROUP_ORDER = ['structure', 'element', 'palette', 'motion', 'effects', 'title', 'timing'];
const GROUP_LABEL = { structure: 'Structure / reveal', element: 'Element', palette: 'Palette', motion: 'Motion', effects: 'Effects', title: 'Title / fonts', timing: 'Timing' };

// ---------- ONE selectable-button interaction model ----------
// single click = set current · double-click OR long-press (≥450ms) = toggle randomize-eligibility (dotted).
// opts: { options, get():cur, set(v), inRand(v):bool, toggleRand(v), onChange?() }. .on = current, .rand = dotted.
function psgSelectableBtn(opts) {
  const row = el('div', { class: 'chiprow' });
  const sync = () => [...row.children].forEach(b => { b.classList.toggle('on', opts.get() === b._val); b.classList.toggle('rand', !!opts.inRand(b._val)); });
  for (const o of opts.options) {
    const val = (o && o.val !== undefined) ? o.val : o;
    const b = el('button', { type: 'button', text: (o && o.label) || String(val), title: 'click: set · double-click or hold: toggle Randomize-eligibility' });
    b._val = val;
    let timer = 0, clickT = 0, longed = false;
    const toggle = () => { opts.toggleRand(val); sync(); opts.onChange && opts.onChange(); };
    const setIt = () => { opts.set(val); sync(); opts.onChange && opts.onChange(); };
    // defer the single click so a 2nd click (dblclick) or a long-press can cancel it — set never co-fires with toggle
    b.addEventListener('click', () => { if (longed) { longed = false; return; } clearTimeout(clickT); clickT = setTimeout(setIt, 230); });
    b.addEventListener('dblclick', e => { e.preventDefault(); clearTimeout(clickT); toggle(); });
    b.addEventListener('pointerdown', () => { longed = false; timer = setTimeout(() => { longed = true; clearTimeout(clickT); toggle(); }, 450); });
    const cancel = () => clearTimeout(timer);
    b.addEventListener('pointerup', cancel); b.addEventListener('pointerleave', cancel);
    row.append(b);
  }
  sync();
  return row;
}

function buildUI(app) {

  app.onColorChange = () => { const r = document.getElementById('randomize'); if (r) paintRandomizeGradient(r, app); updateColorSwatches(app); if (ui._codeField && ui._codeVal) ui._codeField.value = ui._codeVal(); };
  app.onParamChange = (k) => { if ((k === 'introDur' || k === 'loopDur' || k === 'outroDur') && ui.layoutScrubMarks) ui.layoutScrubMarks(); };

}
function updateColorSwatches(app) {

// ---------- transport ----------
function buildTransport(app, ui) {
  const tp = document.getElementById('transport'); tp.innerHTML = '';
  const playBtn = el('button', { class: 't on', title: 'Play/Pause', text: '⏸', onclick: () => { app.playing ? app.pause() : app.play(); } });
  app.onPlayState = () => { playBtn.textContent = app.playing ? '⏸' : '▶'; playBtn.classList.toggle('on', app.playing); };   // single source of truth for the play icon
  const stopBtn = el('button', { class: 't', title: 'Reset', text: '⏹', onclick: () => app.seek(0) });
  const loopBtn = el('button', { class: 't' + (app.loop ? ' on' : ''), title: 'Loop playback', text: '⟳', onclick: () => { app.loop = !app.loop; loopBtn.classList.toggle('on', app.loop); if (app.loop && !app.playing) app.play(); } });
  // scrub with intro/loop/outro boundary markers + hover thumbnail preview

  const scrub = el('input', { type: 'range', min: 0, max: app.N - 1, value: 0, id: 'scrub', oninput: e => app.seek(+e.target.value / app.N) });
  const marks = el('div', { class: 'scrubmarks' });
  const preview = el('div', { class: 'scrubprev' }, [el('canvas', { width: 128, height: 72 }), el('span', { class: 'pt' })]);
  const thumb = preview.firstChild;
  scrubWrap.append(scrub, marks, preview);
  ui.scrub = scrub;
  const layoutMarks = () => { marks.innerHTML = ''; for (const t of app.boundaries()) marks.append(el('div', { class: 'scrubmark', style: 'left:' + (t * 100).toFixed(2) + '%' })); };
  layoutMarks(); ui.layoutScrubMarks = layoutMarks;
  let raf = 0;
  scrub.addEventListener('pointermove', e => {
    const r = scrub.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    preview.style.left = (f * 100).toFixed(2) + '%'; preview.classList.add('show');
    preview.querySelector('.pt').textContent = (f * (app.state.params.introDur + app.state.params.loopDur + app.state.params.outroDur)).toFixed(2) + 's';
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; app.thumbAt(f, thumb); });
  });

  const speed = el('select', { class: 'mini', onchange: e => app.speed = +e.target.value });
  for (const s of [0.25, 0.5, 1, 1.5, 2, 3]) speed.append(el('option', { value: s, text: s + '×', selected: s === 1 ? '' : null }));
  const seg = el('div', { class: 'seg' });
  ['Intro', 'Loop', 'Outro', 'Full'].forEach((s, i) => {
    const b = el('button', { class: i === 3 ? 'on' : '', text: s, onclick: () => { [...seg.children].forEach(c => c.classList.remove('on')); b.classList.add('on'); app.stage = s.toLowerCase(); app.play(); playBtn.textContent = '⏸'; playBtn.classList.add('on'); } });
    seg.append(b);
  });
  tp.append(playBtn, stopBtn, loopBtn, scrubWrap, seg, speed);
}

// ---------- panel head (Randomize / Export / family / seed) ----------
function buildHead(app, ui) {

// ---------- control bank ----------
function buildBody(app, ui) { const body = document.getElementById('panelBody'); body.innerHTML = ''; ui.body = body; refreshBody(app, ui); }
function refreshBody(app, ui) {

  for (const g of order) {
    const det = el('details', { class: 'grp', open: (g === 'palette' || g === 'structure') ? '' : null });

// parse a typed colour string → set the base anchor (hex / rgb / oklch / oklab). Returns true on success.

// repaint just the colour visualisations after a colour edit (no refreshBody → no focus loss)

// SCHEMES with real semantics {mono, colourful, full-range} — presets that rewrite the colour bands/values
function cskApplyScheme(app, key) {

  const band = (k, lo, hi) => { const r = row(k); if (r) { r.band.randMin = lo; r.band.randMax = hi; } };
  band('anchorHue', 0, 360);          // EVERY preset: full hue range …
  band('anchorL', 0.2, 0.8);          // … and lightness 0.2..0.8. Presets differ only in chroma.
  if (key === 'mono') {                              // TRUE greyscale

// ---------- export dialog ----------
function buildDialog(app, ui) {
  const presets = { '1920×1080': [1920, 1080], '1280×720': [1280, 720], '3840×2160': [3840, 2160], '1080×1920': [1080, 1920], '1080×1080': [1080, 1080] };
  const sizeSel = el('select', {}); for (const k in presets) sizeSel.append(el('option', { value: k, text: k }));
  const fpsIn = el('input', { type: 'number', value: 30, min: 1, max: 60, style: 'width:70px' });
  const fmtSel = el('select', {}, [el('option', { value: 'zip', text: 'PNG sequence (.zip) — lossless alpha' })]);
  const bar = el('div', { class: 'bar' }, [el('div', {})]); const prog = bar.firstChild;
  const status = el('div', { class: 'note', text: 'Renders every frame at full res with the alpha matte. Use the Python companion for ProRes/VP9-alpha.' });
  const goBtn = el('button', { class: 'go', text: 'Export' });
  const dlg = el('dialog', {}, [
    el('div', { class: 'dlg-h' }, [el('span', { text: 'Export transition' }), el('button', { class: 'chip', text: '✕', onclick: () => dlg.close() })]),
    el('div', { class: 'dlg-b' }, [
      el('label', {}, [el('span', { text: 'Resolution' }), sizeSel]),
      el('label', {}, [el('span', { text: 'FPS' }), fpsIn]),
      el('label', {}, [el('span', { text: 'Format' }), fmtSel]),
      bar, status,
    ]),
    el('div', { class: 'dlg-f' }, [el('button', { text: 'Close', onclick: () => dlg.close() }), goBtn]),
  ]);
  goBtn.addEventListener('click', async () => {
    const [w, h] = presets[sizeSel.value]; goBtn.disabled = true; status.textContent = 'rendering…';
    try {
      const { zip, frames } = await app.exportSequence({ width: w, height: h, fps: +fpsIn.value, yield: true }, (f) => { prog.style.width = (f * 100).toFixed(0) + '%'; });
      app.downloadZip(zip, `psg-${app.state.seed}.zip`); status.textContent = `done — ${frames} frames, ${(zip.length / 1048576).toFixed(1)} MB`;
    } catch (e) { status.textContent = 'export failed: ' + e.message; }
    goBtn.disabled = false;
  });
  document.body.append(dlg); ui.dialog = dlg;
}

// ---------- refresh helpers ----------
function refreshAll(app, ui) {
  refreshBody(app, ui);
  if (ui.seedfield && document.activeElement !== ui.seedfield) ui.seedfield.value = app.state.seed;
  if (ui.famGallery) [...ui.famGallery.children].forEach(b => b.classList.toggle('on', b._val === app.state.familyKey));
  if (ui.layoutScrubMarks) ui.layoutScrubMarks();
  const rnd = document.getElementById('randomize'); if (rnd) paintRandomizeGradient(rnd, app);
}
const clmp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
function snp(v, p) { if (p.step) v = Math.round(v / p.step) * p.step; return +v.toFixed(6); }


// ===== js/main.js =====
// PSG app controller. Owns the state + preview loop (snapped i/N grid), exposes the methods the UI
// and the headless harness drive (roll / seek / setParam / reassemble / export).

const COLOR_KEYS = new Set(['anchorHue', 'anchorL', 'anchorC', 'siblingSpread',
  'gradientTemplate', 'accentTemplate', 'accentTension', 'groundDark', 'setCount']);

function boot() {
  const canvas = document.getElementById('stage');
  let engine;
  try { engine = createEngine(canvas); }
  catch (e) { document.body.innerHTML = '<p style="padding:20px">WebGL2 error: ' + e.message + '</p>'; console.error(e); return; }
  const overlay = document.createElement('canvas'); overlay.id = 'titleOverlay';
  canvas.parentElement.append(overlay);
  const octx = overlay.getContext('2d');

  const app = {
    engine, canvas, overlay, octx,
    state: defaultState('waves'),
    N: 120, fps: 30, speed: 1, playing: true, loop: true, curT: 0, stage: 'full', onFrame: null,
    rows() { return this.state.rows; },
    roll(opts = {}) {

      const seed = opts.seed || ('psg-' + Math.floor(Math.random() * 1e9).toString(36));

        family: opts.family,                                  // forced only on an explicit tile click; else picked from the dotted pool
        famRand: prevFamRand && prevFamRand.size ? [...prevFamRand] : null,
        prevPalette: this.state ? this.state.palette : null,
        rows: this.state ? this.state.rows : null, rowsFamily: this.state ? this.state.familyKey : null,
      }, opts));
      this.state.famRand = prevFamRand; this.state.schemeRand = prevSchemeRand; this.state.scheme = prevScheme;
      // OPT-IN only: a DOTTED scheme re-applies its preset (re-shaping + re-sampling the colour bands). Default pool is
      // empty, so by default nothing is re-applied and every band/value edit persists through Randomize.
      if (prevSchemeRand && prevSchemeRand.size) {
        const sk = makeRng(seed + '-pick').pick([...prevSchemeRand]);
        this.state.scheme = sk; cskApplyScheme(this, sk);
        const crng = makeRng(seed + '-recolour');
        for (const r of this.state.rows) if (r.group === 'palette') this.state.params[r.key] = sampleParam(r, crng);
        clampGamutChroma(this.state.params);

    },
    reassemble() { this.state.palette = assembleTransition(makeRng(this.state.seed), this.state.params); },
    setParam(k, v) { this.state.params[k] = v; if (COLOR_KEYS.has(k)) { this.reassemble(); if (this.onColorChange) this.onColorChange(); } if (this.onParamChange) this.onParamChange(k); this.refresh(); },
    setFamily(k) { this.roll({ family: k }); },
    applyScheme(k) { this.state.scheme = k; cskApplyScheme(this, k); this.reassemble(); this.refresh(); },   // load a preset's ranges (UI adds refreshBody)
    // tiny thumbnail of frame t for the scrub hover-preview (snapshot is synchronous after the draw, so no preserveDrawingBuffer needed)
    thumbAt(t, thumbCanvas) {
      const wasPlaying = this.playing; this.playing = false;
      engine.drawFrame(this.state, t);
      const g = thumbCanvas.getContext('2d'); g.clearRect(0, 0, thumbCanvas.width, thumbCanvas.height);
      g.drawImage(canvas, 0, 0, thumbCanvas.width, thumbCanvas.height);

    play() { this.playing = true; if (this._ended) { this._acc = 0; this._ended = false; } if (this.onPlayState) this.onPlayState(); },
    pause() { this.playing = false; if (this.onPlayState) this.onPlayState(); },
    paintTitle() { tlPaintOverlay(octx, overlay.width, overlay.height, this.state.params, this.state.palette, this.curT); },
    seek(t) { this.playing = false; this.curT = t; engine.drawFrame(this.state, t); this.paintTitle(); if (this.onFrame) this.onFrame(t); if (this.onPlayState) this.onPlayState(); },
    renderAt(t) { this.playing = false; engine.drawFrame(this.state, t); },     // harness
    refresh() { if (!this.playing) { engine.drawFrame(this.state, this.curT); this.paintTitle(); } },

  app.state.famRand = new Set(Object.keys(FAMILIES));   // all families dotted = eligible by default
  app.state.schemeRand = new Set();                     // NO preset dotted by default → Randomize never re-applies one → edits persist
  app.state.scheme = 'colourful';                       // active preset (the default bands ARE the colourful preset)

  resizeCanvas(app);

  // preview loop — playhead advances by wall-clock*speed but the rendered t is ALWAYS snapped to i/N

  function loop(now) {

// stage sub-range [lo,hi] in t for Intro/Loop/Outro/Full (from durations)
function STAGE_RANGE(state, stage) {
  const p = state.params, i = p.introDur || 1.83, l = p.loopDur || 1.73, o = p.outroDur || 1.43, tot = i + l + o;

function resizeCanvas(app) {
  const wrap = app.canvas.parentElement, r = wrap.getBoundingClientRect();
  const aspect = 16 / 9;

  if (w / h > aspect) w = h * aspect; else h = w / aspect;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
